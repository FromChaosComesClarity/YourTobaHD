<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <radialGradient id="bgGlow" cx="50%" cy="40%" r="65%">
      <stop offset="0%" stop-color="#2a2424" />
      <stop offset="100%" stop-color="#0e0c0c" />
    </radialGradient>
    <!-- Panel: a flat, edge-lit screen rather than a phosphor tube -->
    <linearGradient id="panel" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ff4040" />
      <stop offset="55%" stop-color="#e01818" />
      <stop offset="100%" stop-color="#9a0808" />
    </linearGradient>
    <linearGradient id="sheen" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity=".28" />
      <stop offset="45%" stop-color="#ffffff" stop-opacity="0" />
    </linearGradient>
  </defs>

  <rect width="512" height="512" rx="100" fill="url(#bgGlow)" />

  <!-- Thin-bezel 16:9 panel -->
  <rect x="44" y="118" width="424" height="250" rx="18" fill="#161414" stroke="#3a3636" stroke-width="5" />
  <rect x="56" y="130" width="400" height="226" rx="10" fill="url(#panel)" />
  <rect x="56" y="130" width="400" height="226" rx="10" fill="url(#sheen)" />

  <!-- Play -->
  <path d="M 228 196 L 300 243 L 228 290 Z" fill="#ffffff" />

  <!-- HD badge -->
  <rect x="384" y="314" width="58" height="30" rx="7" fill="#ffffff" fill-opacity=".95" />
  <text x="413" y="336" text-anchor="middle" font-family="Poppins, Inter, Arial, sans-serif" font-weight="800" font-size="20" fill="#c41010">HD</text>

  <!-- Stand -->
  <path d="M 226 368 L 286 368 L 300 404 L 212 404 Z" fill="#2a2727" />
  <rect x="168" y="400" width="176" height="10" rx="5" fill="#3a3636" />
</svg>
